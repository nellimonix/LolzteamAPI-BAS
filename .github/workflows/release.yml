name: Package Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          STAGING="/tmp/LolzteamApi"
          mkdir -p "$STAGING"

          rsync -a \
            --exclude='README.md' \
            --exclude='README' \
            --exclude='README.txt' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.git' \
            --exclude='codegen.py' \
            --exclude='compact_schema.py' \
            --exclude='audit.py' \
            --exclude='README_CODEGEN.md' \
            --exclude='*.zip' \
            ./ "$STAGING/"

          cd /tmp
          zip -r "$GITHUB_WORKSPACE/LolzteamApi.zip" "LolzteamApi"

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "LolzteamApi.zip" --clobber